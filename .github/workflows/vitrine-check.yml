name: Vitrine checks

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Check and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Security audit
        run: |
          for attempt in 1 2 3; do
            npm audit --audit-level=high --fetch-timeout=30000 --fetch-retries=0 && exit 0
            if [ "$attempt" -lt 3 ]; then
              echo "npm audit failed, retrying after a short delay..."
              sleep $((attempt * 10))
            fi
          done
          exit 1

      - name: Syntax check
        run: npm run check

      - name: Catalog and database privacy tests
        run: npm test

      - name: Production build
        run: npm run build
