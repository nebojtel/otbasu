<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fbf0df">
  <title>ОТБАСЫ | Витрина</title>
  <link rel="stylesheet" href="/vitrine/styles.css">
  <link rel="stylesheet" href="/vitrine/product-cards.css">
  <script type="module" src="/src/vitrine.js"></script>
</head>
<body>
  <main class="app" aria-label="Витрина ОТБАСЫ">
    <section class="screen">
      <header class="hero">
        <img class="hero-decor decor-left" src="/assets/hero-decor-left.webp" alt="" width="420" height="1402" loading="lazy" decoding="async" fetchpriority="low">
        <img class="hero-decor decor-right" src="/assets/hero-decor-right.webp" alt="" width="470" height="1402" loading="lazy" decoding="async" fetchpriority="low">

        <img class="brand-logo" src="/assets/otbasy-logo-final.webp" alt="ОТБАСЫ" width="166" height="166" decoding="async">

        <p class="eyebrow" data-hero-eyebrow>Instagram витрина</p>
        <h1 data-hero-title>Товары для дома и семьи</h1>

        <a class="hero-button" href="#catalog" data-hero-button>
          Смотреть товары
        </a>
      </header>

      <div class="kaspi-sticky">
        <a class="kaspi-store-link" href="#" data-kaspi-store-link aria-label="Смотреть все товары магазина ОТБАСЫ на Kaspi">
          <span class="kaspi-store-icon" aria-hidden="true"></span>
          <span>
            <strong>Все товары ОТБАСЫ</strong>
            <small>Открыть магазин на Kaspi</small>
          </span>
        </a>
      </div>

      <section class="catalog" id="catalog" aria-label="Каталог товаров">
        <div class="catalog-header">
          <h2 data-catalog-title>Популярные товары</h2>
          <span data-product-count>Загрузка…</span>
        </div>

        <label class="search-bar">
          <span class="search-icon" aria-hidden="true"></span>
          <input data-search-input type="search" placeholder="Найти товар из обзора..." aria-label="Найти товар из обзора">
        </label>

        <div class="filter-row" aria-label="Фильтры каталога">
          <button class="filter-select" type="button" data-category-filter>Все категории <span class="select-arrow" aria-hidden="true"></span></button>
          <button class="filter-select" type="button" data-sort-toggle>По порядку <span class="select-arrow" aria-hidden="true"></span></button>
        </div>

        <div class="products-list" data-products-list aria-busy="true">
          <div class="empty-state" role="status" aria-live="polite">
            <strong>Загружаем товары…</strong>
            <span>Пожалуйста, подождите немного.</span>
          </div>
        </div>
      </section>

      <nav class="bottom-nav" aria-label="Нижняя навигация">
        <a class="active" href="#catalog" data-vitrine-filter="all" aria-current="page">
          <span class="nav-icon nav-home" aria-hidden="true"></span>
          <span class="nav-label">Все</span>
        </a>
        <a href="#catalog" data-vitrine-filter="hit">
          <span class="nav-icon nav-flame" aria-hidden="true"></span>
          <span class="nav-label">Хиты</span>
        </a>
        <a href="#catalog" data-vitrine-filter="new">
          <span class="nav-icon nav-sparkles" aria-hidden="true"></span>
          <span class="nav-label">Новинки</span>
        </a>
        <a href="#catalog" data-vitrine-filter="promo">
          <span class="nav-icon nav-tag" aria-hidden="true"></span>
          <span class="nav-label">Акции</span>
        </a>
      </nav>
    </section>
  </main>

  <div class="gallery-modal" id="galleryModal" aria-hidden="true">
    <div class="gallery-backdrop" data-gallery-close></div>
    <section class="gallery-sheet" role="dialog" aria-modal="true" aria-label="Галерея товара">
      <button class="gallery-close" type="button" data-gallery-close aria-label="Закрыть галерею">×</button>
      <div class="gallery-stage">
        <button class="gallery-nav gallery-prev" type="button" data-gallery-prev aria-label="Предыдущее фото">‹</button>
        <img class="gallery-image" src="" alt="" decoding="async">
        <button class="gallery-nav gallery-next" type="button" data-gallery-next aria-label="Следующее фото">›</button>
      </div>
      <div class="gallery-info">
        <strong class="gallery-title">Товар</strong>
        <span class="gallery-counter">1 / 1</span>
      </div>
      <div class="gallery-dots" aria-label="Фото в галерее"></div>
    </section>
  </div>
</body>
</html>
